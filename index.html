<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lngual</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --accent: #9328FF;
    --border: #e5e5e5;
    --card-hover: #fbfafd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 96px 28px 64px;
  }
  .brand {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin: 0;
  }
  .accent-bar {
    width: 36px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin: 14px 0 56px;
  }
  .section-label {
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .cards {
    display: grid;
    gap: 10px;
  }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: var(--fg);
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
  }
  .card-text { display: block; }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .card-desc {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  .chev {
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
    margin-left: 16px;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .card:hover .chev {
    color: var(--accent);
    transform: translateX(2px);
  }
  footer {
    border-top: 1px solid var(--border);
    padding: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  footer p { margin: 0 0 4px; }
  footer p:last-child { margin: 0; }
</style>
</head>
<body>
<div class="page">

<main>
  <h1 class="brand">Lngual</h1>
  <div class="accent-bar"></div>

  <p class="section-label">Legal &amp; Support</p>

  <div class="cards">
    <a class="card" href="privacy.html">
      <span class="card-text">
        <span class="card-title">Privacy Policy</span>
        <span class="card-desc">How we handle and protect your information.</span>
      </span>
      <span class="chev">&rsaquo;</span>
    </a>
    <a class="card" href="delete-account.html">
      <span class="card-text">
        <span class="card-title">Account Deletion</span>
        <span class="card-desc">Request the deletion of your account and data.</span>
      </span>
      <span class="chev">&rsaquo;</span>
    </a>
  </div>
</main>

<footer>
  <p>For support, contact <a href="mailto:support@lngual.com">support@lngual.com</a></p>
  <p>&copy; 2026 Lngual. All rights reserved.</p>
</footer>

</div>
</body>
</html>
